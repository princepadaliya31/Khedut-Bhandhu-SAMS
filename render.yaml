# Render Blueprint Specification (https://render.com/docs/blueprints)
services:
  # Node.js Express Backend Service
  - type: web
    name: khedut-bandhu-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: MONGO_URI
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: AI_SERVICE_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false

  # Python FastAPI AI Service (Warning: Needs Starter plan or Hugging Face to avoid 512MB RAM crashes)
  - type: web
    name: khedut-bandhu-ai-service
    env: python
    plan: starter # Starter plan has 2GB RAM. Change to free if you want to try, but it may Out-Of-Memory crash.
    rootDir: ai-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
